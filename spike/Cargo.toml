[package]
name = "folio-spike"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
dioxus = "0.7.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
url = "2"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[dev-dependencies]
http-body-util = "0.1"
proptest = "1"
tower = { version = "0.5", features = ["util"] }
