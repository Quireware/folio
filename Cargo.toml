[workspace]
resolver = "2"
members = [
    "crates/folio-app",
    "crates/folio-core",
    "crates/folio-formats",
    "crates/folio-http",
    "crates/folio-library",
    "crates/folio-platform",
    "crates/folio-reader",
    "crates/folio-server",
    "crates/folio-storage",
    "crates/folio-sync",
]
exclude = ["spike"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
version = "0.1.0"

[workspace.dependencies]
axum = "0.8"
getrandom = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
