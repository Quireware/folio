[package]
name = "folio-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
folio-core = { path = "../folio-core" }
folio-formats = { path = "../folio-formats" }
folio-http = { path = "../folio-http" }
folio-library = { path = "../folio-library" }
folio-platform = { path = "../folio-platform" }
folio-reader = { path = "../folio-reader" }
folio-server = { path = "../folio-server" }
folio-storage = { path = "../folio-storage" }
folio-sync = { path = "../folio-sync" }
thiserror.workspace = true
tracing.workspace = true
dioxus = { version = "0.7.10", optional = true }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
getrandom = "0.2"
url = "2"

[features]
desktop = ["dep:dioxus", "dioxus/desktop"]
mobile = ["dep:dioxus", "dioxus/mobile"]

[dev-dependencies]
rar-codec = "0.1.9"
tempfile = "3"

[[bin]]
name = "folio"
path = "src/main.rs"
